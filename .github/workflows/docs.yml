name: Docs

on:
  push:
    branches: [ "main" ]
    paths: [ "docs/**", ".github/workflows/docs.yml", "PRIVACY_POLICY.md", "TERMS_OF_SERVICE.md" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "docs/**", ".github/workflows/docs.yml", "PRIVACY_POLICY.md", "TERMS_OF_SERVICE.md" ]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs

    steps:
    - uses: actions/checkout@v7
      with:
        # lastUpdated in the VitePress config reads the git history
        fetch-depth: 0
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: docs/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: npm run docs:build
    - name: Upload Pages artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@v5
      with:
        path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
